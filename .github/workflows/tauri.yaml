name: 'publish'

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/tauri.yaml'
  workflow_dispatch:

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          #   args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Disable initramfs update
        if: startsWith(matrix.platform, 'ubuntu-24.04')
        run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

      - name: Disable man-db update
        if: startsWith(matrix.platform, 'ubuntu-24.04')
        run: sudo rm -f /var/lib/man-db/auto-update

      # - uses: awalsh128/cache-apt-pkgs-action@latest
      #   if: startsWith(matrix.platform, 'ubuntu-24.04')
      #   with:
      #     packages: libwebkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev pkg-config libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev libharfbuzz-dev pkg-config xdg-utils

      # - name: install dependencies (ubuntu only)
      #   if: matrix.platform == 'ubuntu-24.04' # This must match the platform value defined above.
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libwebkit2gtk-4.1-0=2.44.0-2 \
      #       libwebkit2gtk-4.1-dev=2.44.0-2 \
      #       libjavascriptcoregtk-4.1-0=2.44.0-2 \
      #       libjavascriptcoregtk-4.1-dev=2.44.0-2 \
      #       gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
      #       gir1.2-webkit2-4.1=2.44.0-2 \
      #       libappindicator3-dev \
      #       librsvg2-dev \
      #       patchelf

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # - name: install dependencies (ubuntu only)
      #   if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: rui314/setup-mold@v1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-


      - name: install frontend dependencies
        run: bun install # change this to npm, pnpm or bun depending on which one you use.

      # Cache TypeScript incremental builds properly
      - name: Cache TypeScript Build Info
        uses: actions/cache@v4
        with:
          path: |
            **/*.tsbuildinfo
          key: ts-${{ runner.os }}-${{ hashFiles('bun.lockb', '**/tsconfig*.json', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ts-${{ runner.os }}-

    # Cache TypeScript build info
      - name: Cache TypeScript Build Info
        uses: actions/cache@v4
        with:
          path: "**/*.tsbuildinfo"
          key: ts-build-${{ runner.os }}-${{ hashFiles('**/tsconfig*.json') }}
          
      - name: Get version from package.json
        id: package_version
        shell: bash
        run: |
          VERSION=$(bun -e "console.log((await import('./package.json', { assert: { type: 'json' } })).default.version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Sync versions
        run: bun scripts/sync.mjs

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v${{ env.VERSION }} # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v${{ env.VERSION }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
