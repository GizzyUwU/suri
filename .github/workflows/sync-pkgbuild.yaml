name: Sync PKGBUILD version

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/sync-pkgbuild.yaml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install required tools
        run: |
          pacman -Sy --noconfirm base-devel git nodejs npm pacman-contrib sudo

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
          path: repo

      - name: Fix permissions
        run: |
          mv repo /home/builder/repo
          chown -R builder:builder /home/builder/repo

      - name: Get package.json version
        id: pkgjson
        run: |
          VERSION=$(sudo -u builder node -p "require('/home/builder/repo/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync PKGBUILD version
        run: |
          VERSION="${{ steps.pkgjson.outputs.version }}"
          sudo -u builder bash -c "sed -i 's/^pkgver=.*/pkgver=$VERSION/' /home/builder/repo/PKGBUILD"

      - name: Generate .SRCINFO
        run: |
          sudo -u builder bash -c "cd /home/builder/repo && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync PKGBUILD version + update .SRCINFO"
          push_options: --force